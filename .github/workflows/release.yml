name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Test and build APKs
        run: gradle --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/app-debug.apk "release-files/open-archive-${GITHUB_REF_NAME:-manual}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release-files/open-archive-${GITHUB_REF_NAME:-manual}-unsigned.apk"
          fi

      - name: Restore signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/open-archive.jks"

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/open-archive.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "release-files/open-archive-${GITHUB_REF_NAME:-manual}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose "release-files/open-archive-${GITHUB_REF_NAME:-manual}.apk"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-archive-release
          path: release-files/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Open Archive $GITHUB_REF_NAME" \
            --generate-notes
