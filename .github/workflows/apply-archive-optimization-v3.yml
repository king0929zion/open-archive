name: Build APK and deploy download page

on:
  push:
    branches:
      - main
      - optimize/liquid-glass-performance
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/apply-archive-optimization-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: archive-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build permanently signed Android APKs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/archive-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify permanent signing certificate
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          EXPECTED="82:A5:97:05:3A:0A:1A:51:45:B1:33:3A:48:A2:8A:1C:C9:31:E6:B4:F6:E3:6A:21:EB:DD:F1:9A:79:27:75:58"
          ACTUAL="$(keytool -exportcert -rfc \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2)"
          echo "Release certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          VERSION_RAW="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION="${VERSION_RAW%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build smaller permanently signed release APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_PASSWORD"
          mkdir -p "build/symbols/${{ steps.meta.outputs.build_number }}"
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info="build/symbols/${{ steps.meta.outputs.build_number }}" \
            --build-name "${{ steps.meta.outputs.version }}" \
            --build-number "${{ steps.meta.outputs.build_number }}"

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            echo "$(basename "$APK"): signature verified"
          done

      - name: Prepare download site
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp site/index.html _site/index.html

          ARM64_SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          ARMV7_SRC="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          X64_SRC="build/app/outputs/flutter-apk/app-x86_64-release.apk"

          ARM64_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-arm64-v8a.apk"
          ARMV7_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-armeabi-v7a.apk"
          X64_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-x86_64.apk"

          cp "$ARM64_SRC" "_site/downloads/$ARM64_NAME"
          cp "$ARMV7_SRC" "_site/downloads/$ARMV7_NAME"
          cp "$X64_SRC" "_site/downloads/$X64_NAME"
          cp "$ARM64_SRC" _site/downloads/Archive-latest.apk

          ARM64_SIZE="$(stat -c%s "$ARM64_SRC")"
          ARMV7_SIZE="$(stat -c%s "$ARMV7_SRC")"
          X64_SIZE="$(stat -c%s "$X64_SRC")"
          ARM64_SHA="$(sha256sum "$ARM64_SRC" | cut -d ' ' -f1)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/build-info.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "buildNumber": "${{ steps.meta.outputs.build_number }}",
            "latestPath": "downloads/Archive-latest.apk",
            "sizeBytes": $ARM64_SIZE,
            "sha256": "$ARM64_SHA",
            "certificateSha256": "82:A5:97:05:3A:0A:1A:51:45:B1:33:3A:48:A2:8A:1C:C9:31:E6:B4:F6:E3:6A:21:EB:DD:F1:9A:79:27:75:58",
            "commit": "$GITHUB_SHA",
            "builtAt": "$BUILT_AT",
            "downloads": [
              {"label": "推荐 · ARM64", "abi": "arm64-v8a", "path": "downloads/$ARM64_NAME", "sizeBytes": $ARM64_SIZE},
              {"label": "兼容 · 32 位 ARM", "abi": "armeabi-v7a", "path": "downloads/$ARMV7_NAME", "sizeBytes": $ARMV7_SIZE},
              {"label": "模拟器 · x86_64", "abi": "x86_64", "path": "downloads/$X64_NAME", "sizeBytes": $X64_SIZE}
            ]
          }
          EOF
          touch _site/.nojekyll

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Archive-APK-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: Archive-symbols-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}
          path: build/symbols/${{ steps.meta.outputs.build_number }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
