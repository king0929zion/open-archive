name: Build APK and deploy download page

on:
  push:
    branches:
      - main
      - optimize/liquid-glass-performance
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: archive-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized Android APKs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          VERSION_RAW="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION="${VERSION_RAW%%+*}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build smaller release APKs
        shell: bash
        run: |
          mkdir -p "build/symbols/${{ steps.meta.outputs.build_number }}"
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info="build/symbols/${{ steps.meta.outputs.build_number }}" \
            --build-name "${{ steps.meta.outputs.version }}" \
            --build-number "${{ steps.meta.outputs.build_number }}"

      - name: Prepare download site
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp site/index.html _site/index.html

          ARM64_SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          ARMV7_SRC="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          X64_SRC="build/app/outputs/flutter-apk/app-x86_64-release.apk"

          ARM64_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-arm64-v8a.apk"
          ARMV7_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-armeabi-v7a.apk"
          X64_NAME="Archive-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}-x86_64.apk"

          cp "$ARM64_SRC" "_site/downloads/$ARM64_NAME"
          cp "$ARMV7_SRC" "_site/downloads/$ARMV7_NAME"
          cp "$X64_SRC" "_site/downloads/$X64_NAME"
          cp "$ARM64_SRC" _site/downloads/Archive-latest.apk

          ARM64_SIZE="$(stat -c%s "$ARM64_SRC")"
          ARMV7_SIZE="$(stat -c%s "$ARMV7_SRC")"
          X64_SIZE="$(stat -c%s "$X64_SRC")"
          ARM64_SHA="$(sha256sum "$ARM64_SRC" | cut -d ' ' -f1)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > _site/build-info.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "buildNumber": "${{ steps.meta.outputs.build_number }}",
            "latestPath": "downloads/Archive-latest.apk",
            "sizeBytes": $ARM64_SIZE,
            "sha256": "$ARM64_SHA",
            "commit": "$GITHUB_SHA",
            "builtAt": "$BUILT_AT",
            "downloads": [
              {"label": "推荐 · ARM64", "abi": "arm64-v8a", "path": "downloads/$ARM64_NAME", "sizeBytes": $ARM64_SIZE},
              {"label": "兼容 · 32 位 ARM", "abi": "armeabi-v7a", "path": "downloads/$ARMV7_NAME", "sizeBytes": $ARMV7_SIZE},
              {"label": "模拟器 · x86_64", "abi": "x86_64", "path": "downloads/$X64_NAME", "sizeBytes": $X64_SIZE}
            ]
          }
          EOF
          touch _site/.nojekyll

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Archive-APK-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: Archive-symbols-v${{ steps.meta.outputs.version }}-build-${{ steps.meta.outputs.build_number }}
          path: build/symbols/${{ steps.meta.outputs.build_number }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
