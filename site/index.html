<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <title>Archive for Android</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #111; background: radial-gradient(circle at 20% 5%, rgba(255,255,255,.95), transparent 36%), linear-gradient(145deg, #eceff3, #fafafa 52%, #e8ebef); }
    .shell { width: min(100%, 720px); }
    .card { position: relative; overflow: hidden; padding: clamp(28px, 6vw, 56px); border: 1px solid rgba(255,255,255,.85); border-radius: 36px; background: rgba(255,255,255,.58); box-shadow: 0 24px 80px rgba(17,24,39,.12), inset 0 1px 0 rgba(255,255,255,.96); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); }
    .card::before { content: ""; position: absolute; inset: -40% auto auto -15%; width: 68%; aspect-ratio: 1; border-radius: 999px; background: rgba(255,255,255,.76); filter: blur(50px); pointer-events: none; }
    .eyebrow { position: relative; margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #71717a; }
    h1 { position: relative; margin: 0; font-size: clamp(38px, 8vw, 72px); line-height: .98; letter-spacing: -.055em; }
    .lead { position: relative; max-width: 520px; margin: 22px 0 30px; color: #5f6368; font-size: 16px; line-height: 1.75; }
    .download { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 28px; border-radius: 999px; background: #171717; color: #fff; font-weight: 700; text-decoration: none; box-shadow: 0 12px 32px rgba(0,0,0,.18); transition: transform .16s ease, box-shadow .16s ease; }
    .download:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(0,0,0,.22); }
    .download:active { transform: scale(.98); }
    .meta { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 34px; }
    .item { padding: 14px 16px; border-radius: 18px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8); }
    .label { display: block; color: #8b8d93; font-size: 11px; margin-bottom: 4px; }
    .value { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 650; }
    .foot { margin: 16px 4px 0; color: #85878d; font-size: 12px; line-height: 1.6; }
    @media (max-width: 520px) { body { padding: 16px; } .card { border-radius: 28px; } .meta { grid-template-columns: 1fr; } .download { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { .download { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Archive Android</p>
      <h1>把最新版本<br>装进手机。</h1>
      <p class="lead">这里始终指向 GitHub Actions 最新成功构建的 Android APK。点击下面的按钮即可直接下载。</p>
      <a id="download" class="download" href="./downloads/Archive-latest.apk" download>下载最新 APK</a>
      <div class="meta">
        <div class="item"><span class="label">版本</span><span class="value" id="version">读取中</span></div>
        <div class="item"><span class="label">构建</span><span class="value" id="build">读取中</span></div>
        <div class="item"><span class="label">文件大小</span><span class="value" id="size">读取中</span></div>
        <div class="item"><span class="label">更新时间</span><span class="value" id="time">读取中</span></div>
      </div>
    </section>
    <p class="foot">首次安装时，Android 可能要求你允许浏览器安装未知来源应用。APK 由 GitHub Actions 自动构建并通过 GitHub Pages 发布。</p>
  </main>
  <script>
    const formatBytes = (bytes) => {
      if (!Number.isFinite(bytes)) return '未知';
      const units = ['B', 'KB', 'MB', 'GB'];
      let value = bytes;
      let index = 0;
      while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
      return `${value.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    };
    fetch('./build-info.json', { cache: 'no-store' })
      .then((response) => response.json())
      .then((info) => {
        document.getElementById('version').textContent = `v${info.version}`;
        document.getElementById('build').textContent = `#${info.buildNumber}`;
        document.getElementById('size').textContent = formatBytes(Number(info.sizeBytes));
        document.getElementById('time').textContent = new Date(info.builtAt).toLocaleString('zh-CN');
        document.getElementById('download').href = `./${info.latestPath}`;
      })
      .catch(() => {
        document.getElementById('version').textContent = '最新稳定版';
        document.getElementById('build').textContent = '自动构建';
        document.getElementById('size').textContent = '点击下载';
        document.getElementById('time').textContent = 'GitHub Pages';
      });
  </script>
</body>
</html>
